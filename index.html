<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d6fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>CAD Clima 2D</title>
<style>
/* VOICE: puesto de trabajo de CAD, sobrio, oscuro, denso como un programa de escritorio
   IDEA: la ventana clásica de un CAD de oficina técnica: barra de título, cinta, área gráfica, línea de comandos flotante, barra de estado
   PICTURE: el área de dibujo ocupa todo; la cinta arriba con iconos propios
   COLOUR and TYPE: grafito azulado, acento azul, Segoe UI como en Windows
   LAYOUT: proporciones de escritorio; tamaño de interfaz ajustable en Opciones */
:root{--fs:12px;--cmdfs:14px;--ttl:#2a2e35;--tab:#30353d;--rib:#3b414c;--pan:#3b414c;--ptl:#333944;--brd:#262a31;--ink:#e7e9ec;--mute:#a7afba;--hov:#4c5563;--on:#5a6578;--acc:#2a95d8;--inp:#262b33;--st:#2b3038;--dlg:#3b414c;--warn:#ff7a5c;color-scheme:dark}
body.lt{--ttl:#dfe2e6;--tab:#e8eaed;--rib:#f3f4f6;--pan:#f3f4f6;--ptl:#e3e6ea;--brd:#c4c9d0;--ink:#1e2124;--mute:#5d6570;--hov:#d6e6f5;--on:#c3dcf2;--inp:#ffffff;--st:#e3e6ea;--dlg:#f3f4f6;--warn:#c4361a;color-scheme:light}
html{font-size:var(--fs)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--rib);color:var(--ink);font:1rem/1.3 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:0}
svg{display:block}
/* barra de título */
#title{display:flex;align-items:center;height:2.9rem;background:var(--ttl);border-bottom:1px solid var(--brd);padding-right:.5rem}
@media (display-mode: window-controls-overlay){#title{padding-left:env(titlebar-area-x,0);padding-right:calc(100vw - env(titlebar-area-x,0px) - env(titlebar-area-width,100vw));-webkit-app-region:drag;app-region:drag}#title button,#qa,#qa *{-webkit-app-region:no-drag;app-region:no-drag}}
#appb{width:3.6rem;height:100%;border:0;background:#1d6fa8;color:#fff;display:grid;place-items:center}
#appb:hover{background:#2582c3}
#qa{display:flex;align-items:center;gap:.1rem;padding:0 .5rem}
.qa{width:2.2rem;height:2.2rem;border:0;border-radius:.2rem;background:none;display:grid;place-items:center;color:var(--ink)}
.qa:hover{background:var(--hov)}
#ttl{flex:1;text-align:center;font-size:1.08rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl b{font-weight:600}
/* cinta */
#rtabs{display:flex;align-items:flex-end;gap:.15rem;height:2.25rem;background:var(--tab);padding:0 .4rem;overflow-x:auto}
.rt{height:2rem;padding:0 1rem;border:0;border-radius:.25rem .25rem 0 0;background:none;font-size:1.05rem;color:var(--mute);white-space:nowrap}
.rt:hover{color:var(--ink)}
.rt.on{background:var(--rib);color:var(--ink);font-weight:600}
#rbody{display:flex;align-items:stretch;height:8.4rem;background:var(--rib);border-bottom:1px solid var(--brd);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#rbody::-webkit-scrollbar{display:none}
body{position:relative}
body.rmin #rbody{display:none}
body.rmin.rpop #rbody{display:flex;position:absolute;left:0;right:0;top:5.15rem;z-index:30;box-shadow:0 8px 20px #0008}
body.clean #title,body.clean #rtabs,body.clean #rbody,body.clean #ftabs{display:none}
body:not(.ftabs) #ftabs{display:none}
#rtabs .rmb{margin-left:auto;align-self:center;border:0;background:none;color:var(--mute);width:2rem;height:1.8rem;border-radius:.2rem}
#rtabs .rmb:hover{background:var(--hov);color:var(--ink)}
.pnl{flex:none;display:flex;flex-direction:column;border-right:1px solid var(--brd)}
.pnl>.pc{flex:1;display:flex;gap:.1rem;padding:.25rem .3rem 0;align-items:flex-start}
.pnl>.pt{height:1.55rem;display:flex;align-items:center;justify-content:center;background:var(--ptl);color:var(--mute);font-size:.95rem;white-space:nowrap;padding:0 .8rem}
.big{width:4.6rem;min-height:5.9rem;border:1px solid transparent;border-radius:.2rem;background:none;display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.25rem .1rem;font-size:.95rem;line-height:1.1;text-align:center;color:var(--ink)}
.big svg{width:2.67rem;height:2.67rem}
.stk{display:flex;flex-direction:column;gap:.05rem}
.sm{height:1.95rem;border:1px solid transparent;border-radius:.2rem;background:none;display:flex;align-items:center;gap:.35rem;padding:0 .4rem 0 .25rem;font-size:.97rem;white-space:nowrap;color:var(--ink)}
.sm svg{width:1.34rem;height:1.34rem;flex:none}
.sm.io{padding:0 .3rem}
.big:hover,.sm:hover{background:var(--hov);border-color:var(--brd)}
.cmb{display:flex;align-items:center;gap:.3rem;height:1.95rem}
.cmb select{height:1.75rem;background:var(--inp);border:1px solid var(--brd);border-radius:.15rem;padding:0 .3rem;font-size:.97rem}
.cmb .sw{width:1.05rem;height:1.05rem;border:1px solid var(--brd);flex:none}
.cmb label{color:var(--mute);font-size:.9rem;width:4.6rem}
/* pestañas de archivo */
#ftabs{display:flex;align-items:flex-end;gap:.1rem;height:2.3rem;background:var(--tab);padding:0 .4rem;border-bottom:1px solid var(--brd)}
.ft{height:1.95rem;padding:0 1rem;border:0;border-radius:.2rem .2rem 0 0;background:none;color:var(--mute);font-size:1rem;white-space:nowrap}
.ft.on{background:#212830;color:#fff}
body.lt .ft.on{background:#fff;color:#000}
/* área gráfica */
main{position:relative;min-height:0;flex:1 1 0}
#title,#rtabs,#rbody,#ftabs,#st{flex:none}
#wrap{position:absolute;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:none;touch-action:none;display:block}
#dyn{position:absolute;pointer-events:none;display:none;font:var(--cmdfs)/1.25 "Segoe UI",system-ui,sans-serif;z-index:3}
#dyn .dp{background:#e9eef4ee;color:#111;border:1px solid #8a96a6;padding:.1rem .45rem;white-space:nowrap;margin-bottom:2px;display:inline-block}
#dyn .dv{background:#fff;color:#000;border:1px solid #2a95d8;padding:.1rem .45rem;min-width:5rem;display:inline-block;margin-right:3px}
/* paleta de propiedades */
#side{position:absolute;left:.6rem;top:.6rem;width:25rem;max-height:calc(100% - 8rem);overflow-y:auto;background:var(--dlg);border:1px solid var(--brd);box-shadow:0 6px 20px #0007;z-index:4;font-size:1.05rem;display:none}
#side.open{display:block}
#sideH{display:flex;align-items:center;justify-content:space-between;height:2.2rem;background:var(--ptl);padding:0 .5rem 0 .7rem;font-weight:600;letter-spacing:.02em;position:sticky;top:0}
#sideH button{border:0;background:none;width:2rem;height:2rem;font-size:1.3rem;color:var(--mute)}
#side section{padding:.6rem .7rem;border-bottom:1px solid var(--brd)}
#side h2{font-size:1.05rem;margin:0 0 .4rem;color:var(--mute);font-weight:600}
.lay{display:grid;grid-template-columns:1.8rem 1.6rem minmax(0,1fr) 3.6rem;align-items:center;gap:.35rem;padding:.2rem .25rem;border-radius:.2rem}
.lay.cur{background:var(--on)}
.lay .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.lay .sw{width:1.4rem;height:1.4rem;border:1px solid var(--brd);position:relative;overflow:hidden}
.lay .sw select{position:absolute;inset:0;opacity:0;cursor:pointer}
.eye{height:1.9rem;border:1px solid var(--brd);border-radius:.2rem;background:var(--inp);font-size:.9rem}
.eye.off{opacity:.5;text-decoration:line-through}
.lay input[type=radio]{width:1.2rem;height:1.2rem;accent-color:var(--acc)}
.row{display:flex;gap:.4rem;flex-wrap:wrap}
.inp{flex:1;min-width:0;height:2.3rem;padding:0 .5rem;border:1px solid var(--brd);border-radius:.15rem;background:var(--inp);font-size:1.05rem;user-select:text}
.btn{height:2.3rem;padding:0 1rem;border:1px solid var(--brd);border-radius:.2rem;background:var(--hov);font-size:1.05rem}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dan{color:var(--warn)}
#selinfo{color:var(--mute)}
label.pr{display:grid;grid-template-columns:9em minmax(0,1fr);align-items:center;gap:.4rem;margin-top:.35rem;color:var(--ink)}
label.pr .inp{height:2.1rem;padding:0 .35rem}
.tip{font-size:1rem;color:var(--mute);line-height:1.45}
.tip kbd{font:600 .95rem "Segoe UI",sans-serif;background:var(--inp);border:1px solid var(--brd);border-radius:.15rem;padding:0 .3rem;color:var(--ink)}
/* línea de comandos flotante */
#cmdbox{position:absolute;left:1rem;right:1rem;bottom:.7rem;z-index:5;font:var(--cmdfs)/1.35 "Segoe UI",system-ui,sans-serif}
#hist:not(.big){pointer-events:none}
#hist{max-height:calc(var(--cmdfs)*1.35*3 + .6rem);overflow:hidden;padding:.3rem .7rem;background:#2b303aBB;color:#c9ced6;white-space:pre-wrap;display:flex;flex-direction:column;justify-content:flex-end}
body.lt #hist{background:#f4f5f7cc;color:#333}
#hist.big{max-height:45vh;overflow-y:auto;justify-content:flex-start;background:#2b303a}
#hist .c{color:#fff}body.lt #hist .c{color:#000}
#hist .e{color:var(--warn)}
#cmdrow{display:flex;align-items:center;background:#3f4552;border:1px solid #2a2f38;height:calc(var(--cmdfs)*1.35 + 1rem)}
body.lt #cmdrow{background:#fff;border-color:#b9bfc7}
#cmdrow>button{border:0;background:none;color:var(--mute);width:2.2rem;height:100%;display:grid;place-items:center}
#cmdrow>button:hover{color:var(--ink)}
#cmdico{color:var(--mute);padding:0 .4rem 0 .2rem;font-weight:700}
#prompt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;color:var(--ink);padding-right:.4rem}
#prompt a{color:#59b7f0;cursor:pointer;text-decoration:none}
#prompt a:hover{text-decoration:underline}
body.lt #prompt a{color:#0b64a8}
#cmd{flex:1;height:100%;border:0;background:none;outline:none;padding:0 .3rem;text-transform:uppercase;user-select:text}
#cmd::placeholder{color:#8d96a3;text-transform:none}
#acmp{position:absolute;left:2.2rem;bottom:calc(100% + 2px);min-width:22rem;background:#2f343e;border:1px solid #1f2329;box-shadow:0 6px 18px #0008;display:none}
body.lt #acmp{background:#fff;border-color:#b9bfc7}
#acmp div{padding:.25rem .7rem;white-space:nowrap;cursor:pointer;display:flex;gap:.8rem}
#acmp div b{min-width:4rem}#acmp div span{color:var(--mute)}
#acmp div.on,#acmp div:hover{background:var(--acc);color:#fff}#acmp div.on span,#acmp div:hover span{color:#e6f2fb}
/* barra de estado */
#st{display:flex;align-items:center;gap:.15rem;height:2.6rem;background:var(--st);border-top:1px solid var(--brd);padding:0 .4rem;font-size:1rem}
#spaces{display:flex;align-items:stretch;height:100%;gap:.1rem;overflow-x:auto;max-width:45%}
.spt{border:0;background:none;color:var(--mute);padding:0 .9rem;white-space:nowrap;border-top:2px solid transparent;font-size:1rem}
.spt.on{color:var(--ink);background:var(--rib);border-top-color:var(--acc)}
#st .sp{flex:1}
#coord{font-variant-numeric:tabular-nums;color:var(--mute);padding:0 .6rem;white-space:nowrap}
.tg{height:2.1rem;min-width:2.2rem;padding:0 .3rem;border:0;border-radius:.15rem;background:none;color:#8f98a5;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.tg svg{width:1.4rem;height:1.4rem}
.tg:hover{background:var(--hov)}
.tg[aria-pressed=true]{color:#4fb4f3;background:#2a95d822}
body.lt .tg[aria-pressed=true]{color:#0b6fb8}
#tModel{padding:0 .6rem;letter-spacing:.04em}
/* menús y diálogos */
#appm{position:fixed;left:0;top:2.9rem;width:22rem;background:var(--dlg);border:1px solid var(--brd);box-shadow:0 10px 30px #0008;z-index:60;display:none;padding:.3rem}
#appm.open{display:block}
#appm button{display:flex;align-items:center;gap:.7rem;width:100%;height:2.6rem;border:0;background:none;padding:0 .8rem;font-size:1.1rem;text-align:left}
#appm button:hover{background:var(--hov)}
#appm hr{border:0;border-top:1px solid var(--brd);margin:.25rem 0}
#ctx,#ctx .cm{position:fixed;z-index:55;background:var(--dlg);border:1px solid var(--brd);box-shadow:0 10px 30px #0008;padding:.2rem;min-width:17rem;font-size:1.05rem}
#ctx .cm{position:absolute;left:100%;top:-.3rem;display:none}
#ctx .sub{position:relative}#ctx .sub:hover>.cm{display:block}
#ctx .ci{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1.2rem;width:100%;min-height:2.2rem;padding:0 .8rem 0 1.6rem;border:0;background:none;text-align:left;white-space:nowrap;color:var(--ink)}
#ctx .ci:hover{background:var(--hov)}#ctx .ci:disabled{opacity:.4;background:none}#ctx .ci b{font-weight:400;color:var(--mute);font-size:.92rem}
#ctx hr{border:0;border-top:1px solid var(--brd);margin:.2rem 0}
#smenu{position:fixed;z-index:50;background:var(--dlg);border:1px solid var(--brd);box-shadow:0 10px 30px #0008;padding:.2rem;min-width:19rem;max-height:90vh;overflow-y:auto;font-size:1.05rem}
#smenu button{display:grid;grid-template-columns:1.8rem minmax(0,1fr) auto;align-items:center;gap:.5rem;width:100%;min-height:2.2rem;padding:0 .6rem;border:0;background:none;text-align:left}
#smenu button:hover{background:var(--hov)}#smenu b{font-size:.9rem;color:var(--mute)}#smenu hr{border:0;border-top:1px solid var(--brd);margin:.2rem 0}#smenu .ic{width:1.8rem}
.osg{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.2rem 1rem}
.osr{display:grid;grid-template-columns:1.6rem 2rem minmax(0,1fr) auto;align-items:center;gap:.4rem;min-height:2.3rem;cursor:pointer}.osr input,.chk input{width:1.25rem;height:1.25rem;accent-color:var(--acc)}.osr b{font-size:.9rem;color:var(--mute)}
.chk{display:flex;align-items:center;gap:.5rem}
dialog{border:1px solid var(--brd);border-radius:.2rem;background:var(--dlg);color:var(--ink);padding:0;max-width:min(46rem,94vw);width:100%;font-size:1.05rem;box-shadow:0 14px 40px #000a}
dialog.wide{max-width:min(76rem,96vw)}
dialog::backdrop{background:#0006}
dialog h3{margin:0;padding:.6rem 1rem;font-size:1.1rem;font-weight:600;background:var(--ptl);border-bottom:1px solid var(--brd)}
#dlgB{padding:1rem;max-height:72vh;overflow-y:auto}
dialog .acts{display:flex;justify-content:flex-end;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--brd)}
#helpT{width:100%;border-collapse:collapse}
#helpT td{padding:.3rem .4rem;border-bottom:1px solid var(--brd);vertical-align:top}
#helpT td:first-child{font-weight:700;color:#59b7f0;white-space:nowrap}
.lmt{border-collapse:collapse;width:100%}.lmt th{text-align:left;font-weight:600;color:var(--mute);padding:.3rem .4rem;border-bottom:1px solid var(--brd);white-space:nowrap}.lmt td{padding:.2rem .4rem;border-bottom:1px solid var(--brd);vertical-align:middle}.lmt .inp{height:2rem;padding:0 .3rem}.lmt input[type=checkbox],.lmt input[type=radio]{width:1.2rem;height:1.2rem;accent-color:var(--acc)}
.scroll{overflow-x:auto}
fieldset{border:1px solid var(--brd);margin:0 0 .8rem;padding:.5rem .8rem .7rem}
legend{color:var(--mute);padding:0 .3rem}
.opg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.2rem 1.4rem}
.opr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.5rem;min-height:2.3rem}
.opr input[type=range]{width:10rem;accent-color:var(--acc)}
.opr input[type=color]{width:3rem;height:1.9rem;border:1px solid var(--brd);background:none;padding:0}
.opr .num{width:4.5rem;height:2rem}
.opr select{height:2rem}
.ltp{display:block}
@media(max-width:760px){.opg{grid-template-columns:minmax(0,1fr)}#side{width:calc(100% - 1.2rem)}}

/* cuadros de estilos (cota, directriz, texto) */
.stab{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--brd);margin:0 0 .8rem}
.stab button{background:none;border:1px solid transparent;border-bottom:0;color:var(--mute);padding:.45rem .85rem;font:inherit;font-size:1rem;cursor:pointer;border-radius:.2rem .2rem 0 0;margin-bottom:-1px}
.stab button:hover{color:var(--ink);background:var(--hov)}
.stab button.on{color:var(--ink);background:var(--ptl);border-color:var(--brd)}
.sty2{display:grid;grid-template-columns:minmax(0,1fr) minmax(15rem,21rem);gap:1.2rem;align-items:start}
.sty2>div:last-child{position:sticky;top:0}
.sfm{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.sfm h4{margin:.8rem 0 .3rem;font-size:1rem;font-weight:600;color:var(--ink);border-bottom:1px solid var(--brd);padding-bottom:.25rem}
.sfm h4:first-child{margin-top:0}
.sfr{display:grid;grid-template-columns:minmax(10rem,1fr) minmax(0,14rem);align-items:center;gap:.6rem;min-height:2.25rem;padding-left:.7rem;color:var(--ink)}
.sfr .inp{height:2.05rem;padding:0 .35rem;font-size:1rem;width:100%}
.sfr .row{gap:1rem}
.sfr .chk{min-height:1.9rem}
.sfm .dis{opacity:.4;pointer-events:none}
.spv{display:block;width:100%;aspect-ratio:4/3;border:1px solid var(--brd);border-radius:.15rem;background:#fff}
.smgr{display:grid;grid-template-columns:minmax(10rem,15rem) minmax(0,1fr) 11rem;gap:1rem;align-items:start}
.slist{border:1px solid var(--brd);background:var(--inp);min-height:15rem;max-height:24rem;overflow:auto;margin-top:.3rem}
.slist>div{padding:.3rem .6rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist>div:hover{background:var(--hov)}
.slist>div.on{background:var(--acc);color:#fff}
.slist>div.ov{padding-left:1.6rem;font-style:italic}
.sbtn{display:flex;flex-direction:column;gap:.45rem}
.sbtn .btn{width:100%}
.smgr .pr{grid-template-columns:1fr}
@media (max-width:900px){.sty2,.smgr{grid-template-columns:1fr}.sty2>div:last-child{position:static}.sfr{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="title">
  <button id="appb" title="Menú de la aplicación" aria-label="Menú de la aplicación"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 21V4l17 17z"/><path d="M7 17v-4.5l4.5 4.5z"/></svg></button>
  <div id="qa"></div>
  <div id="ttl"><b>CAD Clima 2D</b> &nbsp; <span id="fname">Plano1.dxf</span></div>
</header>
<nav id="rtabs" role="tablist"></nav>
<div id="rbody"></div>
<nav id="ftabs"><button class="ft on" id="ftab">Plano1</button><button class="ft" data-c="NUEVO" title="Plano nuevo">+</button></nav>
<main>
  <div id="wrap"><canvas id="cv"></canvas><div id="dyn"></div></div>
  <aside id="side" aria-label="Propiedades">
    <div id="sideH"><span>PROPIEDADES</span><button id="sideX" title="Cerrar (Ctrl+1)">×</button></div>
    <section><h2>Selección</h2><div id="selinfo">Nada seleccionado</div></section>
    <section id="lysec" hidden><h2>Presentación</h2><div id="lyinfo"></div></section>
    <section>
      <h2>Capas</h2>
      <div id="lays"></div>
      <div class="row" style="margin-top:.5rem"><input id="newLay" class="inp" placeholder="Nueva capa" maxlength="40"><button id="addLay" class="btn">Añadir</button></div>
      <button class="btn" data-run="CAPA" style="width:100%;margin-top:.4rem">Administrador de capas…</button>
    </section>
  </aside>
  <section id="cmdbox">
    <div id="hist"></div>
    <div id="cmdrow"><button id="cmdx" title="Cancelar (Esc)">✕</button><button id="cmdw" title="Opciones (OP)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></button><span id="cmdico">&gt;_</span><span id="prompt"></span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Escriba un comando" aria-label="Línea de comandos"><button id="cmdup" title="Historial (F2)">▴</button></div>
    <div id="acmp"></div>
  </section>
</main>
<footer id="st">
  <div id="spaces"></div>

function pick(w){
  const tol=7/view.s;let best=null,bd=tol;
  for(let i=ents.length-1;i>=0;i--){const e=ents[i];if(!vis(e))continue;const b=bb(e);if(w[0]<b[0]-tol||w[0]>b[2]+tol||w[1]<b[1]-tol||w[1]>b[3]+tol)continue;
    let d=Infinity;if(e.t==='text'&&inPoly(w,textBox(e)))d=0;else if(COMP[e.t]&&comp(e).texts.some(t=>inPoly(w,textBox(t))))d=0;else for(const s of segs(e))d=Math.min(d,dSeg(w,s));
    if(d<bd){bd=d;best=e}}
  return best;
}

function entsInRect(r,cross){
  const edges=[[r[0],r[1],r[2],r[1]],[r[2],r[1],r[2],r[3]],[r[2],r[3],r[0],r[3]],[r[0],r[3],r[0],r[1]]].map(s=>({k:'s',s})),inside=p=>p[0]>=r[0]&&p[0]<=r[2]&&p[1]>=r[1]&&p[1]<=r[3],o=[];
  for(const e of ents){if(!vis(e))continue;const q=bb(e);if(q[0]>=r[0]&&q[2]<=r[2]&&q[1]>=r[1]&&q[3]<=r[3]){o.push(e);continue}if(cross&&bbOver(q,r)){for(const s of segs(e))if(inside([s[0],s[1]])||inside([s[2],s[3]])||edges.some(E=>ixSS({s},E).length)){o.push(e);break}}}
  return o;
}
function finishWin(sx,sy){

/* ---------- pinzamientos ---------- */
function gripsOf(e){
  switch(e.t){
    case 'line':return [[e.x1,e.y1,'p1'],[e.x2,e.y2,'p2'],[(e.x1+e.x2)/2,(e.y1+e.y2)/2,'mv']];
    case 'pline':{const p=e.pts,o=p.map((q,i)=>[q[0],q[1],'v'+i]),n=p.length;for(let i=0;i<n-1+(e.closed&&n>2?1:0);i++){const a=p[i],b=p[(i+1)%n];o.push([(a[0]+b[0])/2,(a[1]+b[1])/2,'m'+i])}return o}
    case 'point':return [[e.x,e.y,'mv']];
    case 'xline':return [[e.x,e.y,'mv']];
    case 'img':return [[e.x,e.y,'mv']];
    case 'ldr':return e.pts.map((p,i)=>[p[0],p[1],'v'+i]);
    case 'circle':return [[e.cx,e.cy,'mv'],[e.cx+e.r,e.cy,'r'],[e.cx,e.cy+e.r,'r'],[e.cx-e.r,e.cy,'r'],[e.cx,e.cy-e.r,'r']];
    case 'arc':{const m=e.a1+span(e.a1,e.a2)/2;return [[e.cx,e.cy,'mv'],[e.cx+e.r*Math.cos(e.a1),e.cy+e.r*Math.sin(e.a1),'a1'],[e.cx+e.r*Math.cos(e.a2),e.cy+e.r*Math.sin(e.a2),'a2'],[e.cx+e.r*Math.cos(m),e.cy+e.r*Math.sin(m),'r']]}
    case 'text':case 'mtext':return [[e.x,e.y,'mv']];
    case 'dim':{const g=dimGeom(e),o=[[e.x1,e.y1,'d1'],[e.x2,e.y2,'d2'],[e.x3,e.y3,'d3']];if(g.tc)o.push([g.tc[0],g.tc[1],'dt']);return o}
    case 'rdim':return e.jog?[[e.x3,e.y3,'d3'],[e.ox,e.oy,'jo'],[e.jx,e.jy,'jj']]:[[e.x3,e.y3,'d3']];
    case 'adim':return [[e.cx,e.cy,'ac'],[e.x1,e.y1,'d1'],[e.x2,e.y2,'d2'],[e.x3,e.y3,'d3']];
    case 'vp':return [[e.x1,e.y1,'k00'],[e.x2,e.y1,'k10'],[e.x2,e.y2,'k11'],[e.x1,e.y2,'k01']];
  }

async function cPoint(){for(;;){const p=await gp('Precise un punto (Intro para terminar)',{enter:true});if(!p)return;add({t:'point',x:p[0],y:p[1]})}}
function pathOf(e){
  if(e.t==='line')return [[e.x1,e.y1],[e.x2,e.y2]];
  if(e.t==='pline')return e.closed?e.pts.concat([e.pts[0]]):e.pts.slice();
  if(e.t==='arc'){const sp=span(e.a1,e.a2),n=Math.max(16,Math.ceil(sp/TAU*256)),o=[];for(let i=0;i<=n;i++){const a=e.a1+sp*i/n;o.push([e.cx+e.r*Math.cos(a),e.cy+e.r*Math.sin(a)])}return o}
  if(e.t==='circle'){const o=[];for(let i=0;i<=256;i++){const a=i/256*TAU;o.push([e.cx+e.r*Math.cos(a),e.cy+e.r*Math.sin(a)])}return o}
  return null;
}
const pathLen=p=>{let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);return s};
function atLen(p,d){for(let i=1;i<p.length;i++){const l=dist(p[i-1],p[i]);if(d<=l||i===p.length-1){const t=l?Math.min(1,d/l):0;return [p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t]}d-=l}return p[p.length-1]}
function entLen(e){if(e.t==='circle')return TAU*e.r;if(e.t==='arc')return span(e.a1,e.a2)*e.r;const p=pathOf(e);return p?pathLen(p):null}

  const e=r.e;let p=pathOf(e);const L=entLen(e);
  if(measure){if(dist(p[p.length-1],r.p)<dist(p[0],r.p)&&e.t!=='circle')p=p.slice().reverse();
    const d=await gnum('Precise longitud de segmento',DEF.meas||1000);if(!(d>0))return;DEF.meas=d;let n=0;for(let s=d;s<L-1e-9;s+=d){const q=atLen(p,s);add({t:'point',x:q[0],y:q[1]});n++}msg(`${n} puntos colocados cada ${fmt(d)}`);}

}

async function lenApply(e,p){
  const m=DEF.lenM||'T';
  if(e.t==='line'){const L=dist([e.x1,e.y1],[e.x2,e.y2]),atEnd=dist(p,[e.x2,e.y2])<dist(p,[e.x1,e.y1]),ux=(e.x2-e.x1)/L,uy=(e.y2-e.y1)/L;
    const setL=nl=>{if(!(nl>0)){msg('La longitud resultante no es válida','e');return}mod();delete e._bb;if(atEnd){e.x2=e.x1+ux*nl;e.y2=e.y1+uy*nl}else{e.x1=e.x2-ux*nl;e.y1=e.y2-uy*nl}draw()};
    if(m==='I')setL(L+(DEF.lenV||0));else if(m==='P')setL(L*(DEF.lenP||100)/100);else if(m==='T')setL(DEF.lenT);
    else{const a=atEnd?[e.x1,e.y1]:[e.x2,e.y2],sg=atEnd?1:-1;const q=await gp('Precise nuevo punto final',{base:a,prev:c=>{const nl=((c[0]-a[0])*ux+(c[1]-a[1])*uy)*sg;return nl>0?[L_(a,[a[0]+ux*nl*sg,a[1]+uy*nl*sg])]:[]}});setL(((q[0]-a[0])*ux+(q[1]-a[1])*uy)*sg)}return}
  if(e.t==='arc'){const sp=span(e.a1,e.a2),L=sp*e.r,atEnd=dist(p,[e.cx+e.r*Math.cos(e.a2),e.cy+e.r*Math.sin(e.a2)])<dist(p,[e.cx+e.r*Math.cos(e.a1),e.cy+e.r*Math.sin(e.a1)]);
    const setL=nl=>{const ns=nl/e.r;if(!(ns>0&&ns<TAU)){msg('La longitud resultante no es válida','e');return}mod();delete e._bb;if(atEnd)e.a2=e.a1+ns;else e.a1=e.a2-ns;draw()};
    if(m==='I')setL(L+(DEF.lenV||0));else if(m==='P')setL(L*(DEF.lenP||100)/100);else if(m==='T')setL(DEF.lenT);else{const q=await gp('Precise nuevo punto final',{base:[e.cx,e.cy]});const a=Math.atan2(q[1]-e.cy,q[0]-e.cx);mod();delete e._bb;if(atEnd)e.a2=a;else e.a1=a;draw()}return}

}

const polyArea=p=>{let a=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1]}return Math.abs(a)/2};

async function cArea(){

function descr(e){

    case 'pline':return `POLILINEA  ${e.closed?'cerrada':'abierta'}, ${e.pts.length} vértices, longitud ${F(entLen(e))}${e.closed?', área '+F(polyArea(e.pts)):''}\n  ${base}`;
    case 'circle':return `CIRCULO  centro (${F(e.cx)}, ${F(e.cy)})  radio ${F(e.r)}  diámetro ${F(2*e.r)}  área ${F(Math.PI*e.r*e.r)}\n  ${base}`;
    case 'arc':return `ARCO  centro (${F(e.cx)}, ${F(e.cy)})  radio ${F(e.r)}  ángulo inicial ${F(nrm(e.a1)/D2R)}°  final ${F(nrm(e.a2)/D2R)}°  longitud ${F(entLen(e))}\n  ${base}`;

function cCommands(){
  const OWN=new Set(['BORRACOTAS','PNG','COMANDOS','APLICARESTILOCOTA']),rowsA=CMDS.filter(c=>c[3]!=='Clima'&&!OWN.has(c[0])).map(c=>({n:c[0],al:c[1],d:c[5],g:c[3],ok:1})),rowsC=CMDS.filter(c=>c[3]==='Clima'||OWN.has(c[0])).map(c=>({n:c[0],al:c[1],d:c[5],g:'Propio',ok:2})),rowsP=PENDING.filter(p=>p[2]).map(p=>({n:p[0],al:p[1],d:p[2],g:p[3],ok:0}));

  dialog('Comandos de AutoCAD 2D',`<p style="margin:0 0 8px"><b>${rowsA.length}</b> de ${tot} comandos 2D disponibles (${Math.round(rowsA.length/tot*100)} %), más ${rowsC.length} comandos propios (clima y utilidades). Quedan fuera 3D, render, nubes de puntos, mallas y servicios en la nube.</p>
  <div class="row" style="margin-bottom:8px"><input id="cmQ" class="inp" placeholder="Buscar comando, alias o descripción"><select id="cmF" class="inp" style="flex:none;width:auto"><option value="">Todos</option><option value="1">Disponibles</option><option value="0">Pendientes</option></select></div>
  <div class="scroll" style="max-height:55vh;overflow-y:auto"><table class="lmt"><thead><tr><th>Comando</th><th>Alias</th><th>Descripción</th><th>Grupo</th><th>Estado</th></tr></thead><tbody id="cmB"></tbody></table></div>`,[['Cerrar',null,true]],true);

}

  inCanvas=true;upd(ev);try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  if(ev.button===1||(ev.button===0&&req&&(req.kind==='pan'||req.kind==='zoomrt'))){ev.preventDefault();const v=baseView();pan={sx:mouseS[0],sy:mouseS[1],act,v,cx:act?act.cx:v.cx,cy:act?act.cy:v.cy,zoom:ev.button===0&&req.kind==='zoomrt',s:v.s,den:act&&act.den};if(pan.zoom)zoomStack.push({...v});return}
  if(ev.button===2){if(ev.shiftKey||ev.ctrlKey){snapMenu(ev.clientX,ev.clientY);return}rcDown={t:performance.now(),x:ev.clientX,y:ev.clientY};return}
  if(ev.button!==0)return;
  if(req&&req.kind==='pt'){if(req.override&&req.override!=='none'&&req.override!=='ext'&&req.override!=='par'&&!cands.length){msg(`No hay ningún punto «${SNAPN[req.override]}» bajo el cursor`,'e');return}givePoint(curPoint());return}
  if(req&&req.kind==='pick'){const e=pick(mouseW);if(e)resolveReq({e,p:mouseW.slice()});else msg('Ningún objeto en ese punto','e');return}
  if(req&&req.kind!=='sel')return;
  if(win){finishWin(...mouseS);return}
  if(!req){const g=gripAt(...mouseS);if(g){if(ev.shiftKey)toggleHot(g);else startGrip(g);return}}
  const e=pick(mouseW);if(e){toggleSel(e,ev.shiftKey);return}
  win={sx:mouseS[0],sy:mouseS[1],drag:false,shift:ev.shiftKey};draw();
});
cv.addEventListener('pointermove',ev=>{
  upd(ev);
  if(pan&&pan.zoom){const k=Math.pow(1.008,pan.sy-mouseS[1]);if(pan.act)pan.act.den=pan.den/k;else pan.v.s=pan.s*k;syncView();draw();return}
  if(pan){if(pan.act){const k=pan.act.den/pan.v.s;pan.act.cx=pan.cx-(mouseS[0]-pan.sx)*k;pan.act.cy=pan.cy+(mouseS[1]-pan.sy)*k}else{pan.v.cx=pan.cx-(mouseS[0]-pan.sx)/pan.v.s;pan.v.cy=pan.cy+(mouseS[1]-pan.sy)/pan.v.s}syncView();mouseW=toW(...mouseS)}
  if(win&&Math.hypot(mouseS[0]-win.sx,mouseS[1]-win.sy)>6)win.drag=true;
  if(gripMenuAt&&Math.hypot(mouseS[0]-gripMenuAt.x,mouseS[1]-gripMenuAt.y)>60){closeCtx();gripMenuAt=null}

/* ---------- teclado ---------- */
document.addEventListener('keydown',ev=>{
  if(dlg.open)return;
  const t=ev.target,k=ev.key;
  if(t!==inp&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
  if(k==='F2'){ev.preventDefault();toggleHist();return}
  if(k==='F12'){ev.preventDefault();setTg('dyn','#tDyn','Entrada dinámica');return}
  if((ev.ctrlKey||ev.metaKey)&&k==='1'){ev.preventDefault();togglePal();return}
  if((ev.ctrlKey||ev.metaKey)&&k==='0'){ev.preventDefault();toggleClean();return}
  if((ev.ctrlKey||ev.metaKey)&&(k==='a'||k==='A')&&t!==inp&&!req){ev.preventDefault();selectAll();return}
  if((ev.ctrlKey||ev.metaKey)&&(k==='a'||k==='A')&&t===inp&&!inp.value&&!req){ev.preventDefault();selectAll();return}
  if((ev.ctrlKey||ev.metaKey)&&(k==='n'||k==='N')){ev.preventDefault();run('NUEVO');return}
  if((ev.ctrlKey||ev.metaKey)&&t!==inp&&!req){const kl=k.toLowerCase();if(kl==='x'){ev.preventDefault();run('CORTARPP');return}if(ev.shiftKey&&kl==='c'){ev.preventDefault();run('COPIABASE');return}if(ev.shiftKey&&kl==='v'){ev.preventDefault();run('PEGABLOQUE');return}}
  if(!req&&acmpList.length&&(k==='ArrowDown'||k==='ArrowUp')){ev.preventDefault();acmpIdx=(acmpIdx+(k==='ArrowDown'?1:acmpList.length-1))%acmpList.length;acmpPick={n:acmpList[acmpIdx].n,nav:true};acmpRender();return}
  if(!req&&acmpList.length&&k==='Tab'){ev.preventDefault();inp.value=acmpList[Math.max(0,acmpIdx)].a;acmpUpdate();return}
  if(!req&&!acmpList.length&&cmdHist.length&&(k==='ArrowUp'||k==='ArrowDown')){ev.preventDefault();cmdHI=Math.max(0,Math.min(cmdHist.length,cmdHI+(k==='ArrowUp'?-1:1)));inp.value=cmdHist[cmdHI]||'';inp.focus();return}
  if(k==='F3'){ev.preventDefault();setTg('osnap','#tSnap','Refent');return}
  if(k==='F7'){ev.preventDefault();setTg('grid','#tGrid','Rejilla');return}
  if(k==='F8'){ev.preventDefault();setTg('ortho','#tOrto','Orto');return}
  if(k==='F10'){ev.preventDefault();setTg('polar','#tPolar','Polar');return}
  if(k==='F11'){ev.preventDefault();setTg('otrack','#tTrack','Rastreo');return}
  if(k==='Tab'&&req&&req.kind==='pt'){ev.preventDefault();if(cands.length>1){candIdx=(candIdx+1)%cands.length;snap=cands[candIdx];curPt=computePoint();draw()}return}
  if((ev.ctrlKey||ev.metaKey)&&!ev.altKey){const kl=k.toLowerCase();if(kl==='z'){ev.preventDefault();if(running)cancelReq();undo();return}if(kl==='y'){ev.preventDefault();if(running)cancelReq();redo();return}if(kl==='p'){ev.preventDefault();run('TRAZAR');return}if(kl==='c'&&!req&&sel.size&&!(t===inp&&inp.selectionStart!==inp.selectionEnd)){ev.preventDefault();cCopyClip();return}if(kl==='v'&&!req&&clip&&!inp.value){ev.preventDefault();run('PEGARPP');return}if(kl==='s'){ev.preventDefault();run('GUARDAR');return}if(kl==='o'){ev.preventDefault();run('ABRIR');return}return}
  if(k==='Escape'){ev.preventDefault();closeMenu();acmpHide();$('#appm').classList.remove('open');$('#hist').classList.remove('big');inp.value='';if(req)cancelReq();else if(hotG.length){hotG=[];draw()}else{sel.clear();win=null;refresh();draw()}return}
  if(k==='Enter'||(k===' '&&!(req&&req.kind==='txt'))){ev.preventDefault();const v=inp.value;inp.value='';if(req&&v.trim()&&(req.kind==='pt'||req.kind==='num'))pushRecentIn(v.trim());submit(v);return}
  if((k==='Delete'||k==='Supr')&&!req&&!inp.value){if(sel.size){ev.preventDefault();run('BORRA')}return}
  if(t!==inp&&k.length===1&&!ev.altKey){ev.preventDefault();inp.focus();inp.value+=k;acmpUpdate();draw();return}
  if(t!==inp&&k==='Backspace'){ev.preventDefault();inp.focus();inp.value=inp.value.slice(0,-1)}
});
